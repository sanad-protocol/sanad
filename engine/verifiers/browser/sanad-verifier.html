<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Sanad verifier</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#555;--ok:#0a6b2d;--bad:#a30f1f;--warn:#7a5200;--line:#ccc}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#aaa;--ok:#5fd68a;--bad:#ff8a8a;--warn:#f2c14e;--line:#444}}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1rem}
label{display:block;margin:.7rem 0 .2rem;font-weight:600}input,select,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:.4rem;color:var(--fg);background:var(--bg);border:1px solid var(--line)}
input[type=checkbox]{width:auto}button{cursor:pointer;margin-top:1rem;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.note,small{color:var(--mut)}
li{margin:.2rem 0;word-break:break-word}textarea{min-height:11rem;font-family:ui-monospace,monospace}
</style></head><body>
<h1>Sanad verifier</h1>
<p>Checks an exported Sanad bundle directory in this page. No network, no libraries: nothing you choose here leaves your device. The issuer and the log key must come from a source you trust; the directory cannot vouch for itself.</p>
<label for="dir">Folder (the base folder holding <code>bundles/</code>, or one bundle folder)</label><input id="dir" type="file" webkitdirectory multiple>
<label for="zip">or a zip of it</label><input id="zip" type="file" accept=".zip,application/zip"><p id="loaded" role="status"><small>Nothing loaded.</small></p>
<label for="issuer">Issuer DID you trust</label><input id="issuer" placeholder="did:key:z...">
<label for="logkey">Log key DID you trust</label><input id="logkey" placeholder="did:key:z...">
<label for="policy">Your policy (JSON; the issuer's recommendation is not used)</label><textarea id="policy" spellcheck="false"></textarea>
<label for="witnesses">Witness DIDs you trust (optional, comma separated)</label><input id="witnesses">
<label for="nwit">Witnesses required</label><input id="nwit" type="number" min="1" value="1">
<label for="minid">Minimum identity assurance</label><select id="minid"><option value="">none</option><option>A0</option><option>A1</option><option>A2</option></select>
<label for="pinned">Pinned did:web keys (JSON, optional)</label><input id="pinned" placeholder='{"did:web:x.example":["z..."]}'>
<label><input id="reqstatus" type="checkbox"> Fail if revocation cannot be checked</label>
<button id="run" type="button">Verify</button>

      if (Array.isArray(sanad.process.shortfall) && sanad.process.shortfall.length) warnings.push('the operator finalized below the template minimum');
      warnings.push('template not supplied: roles and evidence kinds were not checked against it');

      const pol = opts.policy; let recognition = null;
      if (pol === undefined) ADD('policy', false, 'no verifier policy supplied');
      else {
        const pp = core.policyProblems(pol); ADD('policy', pp.length === 0, pp.length ? 'policy refused: ' + pp.join('; ') : 'verifier policy; evaluation day ' + pol.asOf);
        if (pp.length === 0) {
          if ((pol.minAttestorSittings > 0 || pol.minAgreement > 0)) ADD('attestor-statistics', false, 'the policy has a statistics threshold but the only statistics are the issuer\'s');
          try { recognition = core.recognise(bundle, pol, { verifySignature: (a) => sigOk.get(a.id) === true }); } catch (e) { ADD('recognition', false, 'refused: ' + (e && e.message)); }
        }
      }
      return out(recognition && !checks.every((c) => c.ok) ? { ...recognition, unverified: true } : recognition);
    } catch (e) { ADD('internal', false, 'could not be verified: ' + (e && e.message)); return out(); }
  }

  globalThis.SanadVerifier = { verifyTree, readZip, DEFAULT_POLICY };
})(globalThis);
</script>
<script>// Page logic: reads a directory (folder picker) or a zip, collects the verifier's own choices and prints the report. Nothing leaves the page.
(function () {
  'use strict';
  if (typeof document === 'undefined') return;
  const $ = (id) => document.getElementById(id);
  const list = (v) => v.split(',').map((x) => x.trim()).filter(Boolean);
  let files = null;
  $('policy').value = JSON.stringify(SanadVerifier.DEFAULT_POLICY, null, 2);
  async function load(kind, input) {
    try {
      if (kind === 'zip') files = await SanadVerifier.readZip(await input.files[0].arrayBuffer());
      else { files = new Map(); for (const f of input.files) files.set(f.webkitRelativePath || f.name, await f.text()); }
      $('loaded').textContent = files.size + ' files loaded.';
    } catch (e) { files = null; $('loaded').textContent = 'Could not read it: ' + e.message; }
  }
  $('dir').addEventListener('change', (e) => load('dir', e.target));
  $('zip').addEventListener('change', (e) => load('zip', e.target));
  $('run').addEventListener('click', async () => {
    const res = $('result'); res.textContent = '';
    if (!files) { res.textContent = 'Choose a folder or a zip first.'; return; }
    let policy; try { policy = JSON.parse($('policy').value); } catch { res.textContent = 'The policy is not valid JSON.'; return; }
    const o = { policy, trustedIssuers: list($('issuer').value), trustedLogKeys: list($('logkey').value) };
    if ($('witnesses').value.trim()) { o.trustedWitnesses = list($('witnesses').value); o.requireWitnesses = Number($('nwit').value || 1); }
    if ($('minid').value) o.minIdentityLevel = $('minid').value;
    if ($('reqstatus').checked) o.requireStatus = true;
    if ($('pinned').value.trim()) { try { o.pinnedKeys = JSON.parse($('pinned').value); } catch { res.textContent = 'Pinned keys must be JSON like {"did:web:x": ["z..."]}.'; return; } }
    const r = await SanadVerifier.verifyTree(files, o);
    const frag = document.createDocumentFragment();
    const h = document.createElement('h2'); h.textContent = r.ok ? 'All checks passed' : 'Not verified'; h.className = r.ok ? 'ok' : 'bad'; frag.append(h);
    const ul = document.createElement('ul');
    for (const c of r.checks) { const li = document.createElement('li'); li.className = c.ok ? 'ok' : 'bad'; li.textContent = (c.ok ? 'PASS ' : 'FAIL ') + c.name + ': ' + c.detail; ul.append(li); }
    for (const w of r.warnings) { const li = document.createElement('li'); li.className = 'warn'; li.textContent = 'WARN ' + w; ul.append(li); }
    frag.append(ul);
    if (r.recognition) {
      const p = document.createElement('p');
      p.textContent = (r.ok ? '' : 'Unverified, this is what the data would give if it were genuine: ') + 'status ' + r.recognition.status + ', level ' + r.recognition.level + ', confidence ' + r.recognition.confidence + ' (your policy, evaluation day ' + r.recognition.policy.asOf + ')';
      frag.append(p);
      const ol = document.createElement('ol');
      for (const s of r.recognition.explanation) { const li = document.createElement('li'); li.textContent = s.rule + ' ' + s.summary; ol.append(li); }
      frag.append(ol);
    }
    const n = document.createElement('p'); n.className = 'note'; n.textContent = 'Experimental software: a passing report records what was signed and logged, not that the attestors were honest.'; frag.append(n);
    res.append(frag);
  });
})();
</script>
